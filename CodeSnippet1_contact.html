<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrightCart - Contact Us</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f7f9fc; color: #1f2933; }
    header { background: #1d3118; color: #fff; padding: 16px 40px;
             display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #dbe7d4; text-decoration: none; margin-left: 22px; }
    .card { max-width: 460px; margin: 36px auto; background: #fff;
            padding: 28px; border: 1px solid #d9e2ec; border-radius: 10px; }
    .card h2 { color: #1d3118; margin-bottom: 6px; }
    .card p.lead { color: #52606d; font-size: 14px; margin-bottom: 16px; }
    label { display: block; font-size: 14px; margin: 12px 0 6px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 14px; }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: flex; align-items: center; margin-top: 14px; }
    .row input { width: auto; margin-right: 8px; }
    .row label { margin: 0; font-weight: normal; }
    .btn { margin-top: 18px; background: #2f7d32; color: #fff;
           border: none; padding: 12px 28px; border-radius: 6px; cursor: pointer; font-size: 15px; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><strong>BrightCart</strong></div>
    <nav><a href="#home">Home</a><a href="#shop">Shop</a><a href="#contact">Contact</a></nav>
  </header>
  <section class="card">
    <h2>Contact Us</h2>
    <p class="lead">Send us a message and we will reply within one business day.</p>
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Enter your full name">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">
    <label for="subject">Subject</label>
    <select id="subject">
      <option>General question</option>
      <option>Order support</option>
      <option>Feedback</option>
    </select>
    <label for="message">Message</label>
    <textarea id="message" placeholder="How can we help?"></textarea>
    <div class="row">
      <input type="checkbox" id="subscribe">
      <label for="subscribe">Send me product news by email</label>
    </div>
    <button class="btn">Send Message</button>
  </section>
</body>
</html>
