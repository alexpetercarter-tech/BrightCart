<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrightCart - Create Account</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f7f9fc; color: #1f2933; }
    header { background: #1d3118; color: #fff; padding: 16px 40px;
             display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #dbe7d4; text-decoration: none; margin-left: 22px; }
    .signup { max-width: 420px; margin: 40px auto; background: #fff;
              padding: 26px; border: 1px solid #d9e2ec; border-radius: 10px; }
    .signup h2 { color: #1d3118; margin-bottom: 16px; }
    label { display: block; font-size: 14px; margin: 12px 0 6px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd2d9; border-radius: 6px; }
    input.invalid { border-color: #b42318; }
    .error { color: #b42318; font-size: 13px; margin-top: 6px; }
    .btn { margin-top: 18px; background: #2f7d32; color: #fff;
           border: none; padding: 11px 26px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <div class="logo"><strong>BrightCart</strong></div>
    <nav><a href="#home">Home</a><a href="#shop">Shop</a><a href="#help">Help</a></nav>
  </header>
  <section class="signup">
    <h2>Create Your Free Account</h2>
    <label for="name">Full Name</label>
    <input type="text" id="name" class="invalid" required placeholder="Enter your full name">
    <p class="error">Please enter your full name.</p>
    <label for="email">Email Address</label>
    <input type="email" id="email" required placeholder="you@example.com">
    <button class="btn">Sign Up</button>
  </section>
</body>
</html>
